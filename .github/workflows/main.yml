name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/*'
      - 'release/*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: ThreeTierAppProductAPI/ProductApp-UI-main


      # Install & build frontend
      - name: Install and build frontend
        run: |
          npm install --legacy-peer-deps
          CI='' npm run build
        working-directory: ThreeTierAppProductAPI/ProductApp-UI-main

name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/*'
      - 'release/*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    # Permissions required for CodeQL to upload security scan results
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============================================================
      # Security Scanning: Initialize CodeQL
      # CodeQL analyzes the source code for security vulnerabilities
      # (SAST - Static Application Security Testing)
      # ============================================================
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build Backend
        run: mvn clean package -DskipTests=false
        working-directory: ThreeTierAppProductAPI/ProductApp-API-main

      # ============================================================
      # Security Scanning: Perform CodeQL Analysis
      # Uploads results to the GitHub Security tab
      # ============================================================
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

    
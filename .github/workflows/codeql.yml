name: "Security Scan (CodeQL + Gitleaks)"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  # ----------------------------------------
  # 1️⃣ Secret Scanning (Gitleaks)
  # ----------------------------------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true   # Fail pipeline if secrets found

  # ----------------------------------------
  # 2️⃣ CodeQL Analysis
  # ----------------------------------------
  codeql:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    needs: gitleaks   # Run CodeQL after Gitleaks

    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - javascript
          - python
          - csharp
          - go
          - cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

name: "Security Scan (CodeQL + Gitleaks)"

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  # ----------------------------------------
  # 1️⃣ Secret Scanning (Free Gitleaks)
  # ----------------------------------------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks-linux-amd64 -O gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks Scan
        run: |
          gitleaks detect --source . --verbose --redact --exit-code 1

  # ----------------------------------------
  # 2️⃣ CodeQL Analysis
  # ----------------------------------------
  codeql:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    needs: gitleaks

    strategy:
      fail-fast: false
      matrix:
        language:
          - java
          - javascript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
